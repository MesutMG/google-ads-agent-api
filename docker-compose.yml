services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # This saves your models locally so you don't re-download them every time
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # If you have an NVIDIA GPU, uncomment the lines below to enable hardware acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  google-ads-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-ads-agent-api:latest
    container_name: google-ads-agent-api
    restart: unless-stopped
    ports:
      - "6161:6161"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      - ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama_data: