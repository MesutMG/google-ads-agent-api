services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # This saves your models locally so you don't re-download them every time
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # If you have an NVIDIA GPU, uncomment the lines below to enable hardware acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - "until ollama list >/dev/null 2>&1; do sleep 1; done && ollama pull qwen2.5:3b"
    depends_on:
      - ollama
    restart: "no"

  google-ads-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-ads-agent-api:latest
    container_name: google-ads-agent-api
    restart: unless-stopped
    ports:
      - "6161:6161"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama_data: